[package]
name = "bifrost-extension-template"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/BrokkAi/bifrost-extension-template"
description = "Reference application for Bifrost's stable extension APIs"
publish = false

[workspace]
members = [".", "adapters/lsp", "adapters/mcp"]
resolver = "3"

[dependencies]
brokk-bifrost-runtime = "=0.10.1"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.8"

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
