name: Policy scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The action uploads its SARIF report to GitHub code scanning.
  security-events: write

jobs:
  policy-scan:
    name: Bifrost policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The published action's stable reference is the floating major tag
      # `BrokkAi/bifrost-policy-scan@v0`, which follows the newest Bifrost
      # release. This repository requires every third-party action to be
      # SHA-pinned, so the example pins the commit `v0` currently names and
      # keeps the tag in the comment. Copy `@v0` for a gate that tracks
      # releases; pin a commit or an exact `vX.Y.Z` tag for a reproducible one.
      - uses: BrokkAi/bifrost-policy-scan@2e462a5512cab6207d81a53bcae142763a4212d5 # v0 (v0.14.3)
        with:
          # On v0.14.3 these default code-smell policies report
          # capability_incomplete on this workspace's Rust and Python sources,
          # which makes the whole scan UNRELIABLE. Exclude them explicitly so an
          # incomplete rule is never mistaken for a clean finding set; the
          # exclusion is recorded in the report's evaluation context.
          exclude-policy-ids: >-
            bifrost.correctness.contradictory-condition
            bifrost.correctness.discarded-pure-result
            bifrost.correctness.ignored-status-result
            bifrost.correctness.overwritten-unread-value
            bifrost.correctness.unreachable-statement
            bifrost.performance.file-read-in-loop
