name: Policy scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The action uploads its SARIF report to GitHub code scanning.
  security-events: write

jobs:
  policy-scan:
    name: Bifrost policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The published action's stable reference is the floating major tag
      # `BrokkAi/bifrost-policy-scan@v0`, which follows the newest Bifrost
      # release. This repository requires every third-party action to be
      # SHA-pinned, so the example pins the commit `v0` currently names and
      # keeps the tag in the comment. Copy `@v0` for a gate that tracks
      # releases; pin a commit or an exact `vX.Y.Z` tag for a reproducible one.
      - uses: BrokkAi/bifrost-policy-scan@3a5fc1465ca249e6cf5b8240f174819890b75351 # v0 (v0.11.5)
        with:
          # v0.11.5's python-absent-member rule reports capability_incomplete
          # for this workspace. Select the remaining code-smell rules explicitly
          # so an incomplete rule is never mistaken for a clean finding set.
          policy-ids: >-
            bifrost.correctness.dynamic-evaluation
            bifrost.correctness.unsafe-deserialization
            bifrost.correctness.go-data-race
            bifrost.correctness.go-nil-dereference
            bifrost.correctness.go-wrong-error-on-failure-path
            bifrost.correctness.rayon-in-blocking-lazy-init
            bifrost.performance.loop-invariant-sort
            bifrost.performance.regex-compile-in-loop
            bifrost.performance.file-read-in-loop
            bifrost.performance.serialization-in-loop
            bifrost.performance.parsing-in-loop
            bifrost.performance.database-call-in-loop
            bifrost.performance.network-call-in-loop
            bifrost.performance.subprocess-in-loop
            bifrost.performance.sleep-in-loop
            bifrost.performance.expensive-operation-in-nested-loop
