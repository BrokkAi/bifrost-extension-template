name: Policy scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The action uploads its SARIF report to GitHub code scanning.
  security-events: write

jobs:
  policy-scan:
    name: Bifrost policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The published action's stable reference is the floating major tag
      # `BrokkAi/bifrost-policy-scan@v0`, which follows the newest Bifrost
      # release. This repository requires every third-party action to be
      # SHA-pinned, so the example pins the commit `v0` currently names and
      # keeps the tag in the comment. Copy `@v0` for a gate that tracks
      # releases; pin a commit or an exact `vX.Y.Z` tag for a reproducible one.
      - uses: BrokkAi/bifrost-policy-scan@9e63f06687f41a011acf7384638756c396796936 # v0 (v0.14.0)
        with:
          # python-absent-member reported capability_incomplete for this
          # workspace under v0.11.5. Exclude it explicitly and run the rest of
          # bifrost.code-smells so an incomplete rule is never mistaken for a
          # clean finding set; the exclusion is recorded in the report.
          exclude-policy-ids: bifrost.correctness.python-absent-member
